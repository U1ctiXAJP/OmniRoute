services:
  omniroute:
    build:
      context: .
      target: runner-cli
    container_name: omniroute
    restart: unless-stopped
    stop_grace_period: 40s
    network_mode: host
    environment:
      - NODE_ENV=production
      - ALLOW_API_KEY_REVEAL=true
      - OMNIROUTE_LOG_REQUEST_SHAPE=1
      - OMNIROUTE_STREAM_START_TIMEOUT_MS=90000
      - INITIAL_PASSWORD=XXXXX
      - DATA_DIR=/app/data
      - REDIS_URL=redis://localhost:6379
    volumes:
      - omniroute-data:/app/data
    healthcheck:
      test: ["CMD", "node", "healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: omniroute-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  omniroute-data:
    name: omniroute-data
  redis-data:
    name: omniroute-redis-data
